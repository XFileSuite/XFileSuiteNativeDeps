name: Publish Native Dependencies

on:
  push:
    paths:
      - .github/workflows/publish-native-deps.yml
      - native_deps/ffmpeg/**
      - native_deps/media_runtime/**
  pull_request:
    paths:
      - .github/workflows/publish-native-deps.yml
      - native_deps/ffmpeg/**
      - native_deps/media_runtime/**
  workflow_dispatch:
    inputs:
      component:
        description: Component to rebuild and publish
        type: choice
        options: [all, media-runtime, imagemagick, resvg]
        default: all
      platform:
        description: Platform to rebuild and publish
        type: choice
        options: [all, macos, windows]
        default: all
      purge_all_deps:
        description: Delete all existing native dependency objects in R2 before a full rebuild
        type: boolean
        default: false

concurrency:
  group: native-deps-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  test-media-runtime:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Set up current Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install native build tools
        run: |
          brew install cmake ninja nasm pkg-config
          python3 -m venv "$RUNNER_TEMP/media-build-tools"
          "$RUNNER_TEMP/media-build-tools/bin/pip" install "meson==1.3.2"
          echo "$RUNNER_TEMP/media-build-tools/bin" >> "$GITHUB_PATH"
      - name: Restore source and intermediate cache
        id: media-cache
        uses: actions/cache@v4
        with:
          path: native_deps/media_runtime/work
          key: media-runtime-macos-v2-${{ hashFiles('native_deps/ffmpeg/build.sh', 'native_deps/media_runtime/build-macos.sh') }}
          restore-keys: |
            media-runtime-macos-v2-
      - name: Build and package shared media runtime
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          set -o pipefail
          native_deps/media_runtime/build-macos.sh 2>&1 | tee media-runtime-build.log
      - name: Package complete corresponding source
        run: VERSION=8.1.2-mpv-0.41.0 RELEASE_REVISION=1 native_deps/media_runtime/package-source.sh
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-runtime-build-log-${{ github.run_attempt }}
          path: media-runtime-build.log
          if-no-files-found: warn
      - name: Save source and intermediate cache after diagnostics
        if: success() && steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native_deps/media_runtime/work
          key: media-runtime-macos-v2-${{ hashFiles('native_deps/ffmpeg/build.sh', 'native_deps/media_runtime/build-macos.sh') }}
      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: xfilesuite-media-runtime-macos
          path: native_deps/media_runtime/dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish-macos:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'macos') }}
    runs-on: macos-14
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_WRITE_TOKEN: ${{ secrets.XFILESUITE_SOURCE_WRITE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COMPONENT: ${{ inputs.component }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Require the canonical source branch
        run: test "$GITHUB_REF" = "refs/heads/main"
      - name: Set up Rust for resvg
        if: ${{ inputs.component == 'all' || inputs.component == 'resvg' }}
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Go for the media runtime
        if: ${{ inputs.component == 'all' || inputs.component == 'media-runtime' }}
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Validate release credentials
        run: |
          test -n "$SOURCE_WRITE_TOKEN"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Restore source tarballs cache
        id: windows-source-cache
        uses: actions/cache@v4
        with:
          path: |
            native_deps/imagemagick/work/downloads
            native_deps/resvg/target
            native_deps/media_runtime/work
          key: macos-src-v2-${{ inputs.component }}-${{ hashFiles('native_deps/imagemagick/build-macos.sh', 'native_deps/resvg/build-macos.sh', 'native_deps/ffmpeg/build.sh', 'native_deps/media_runtime/build-macos.sh') }}
          restore-keys: |
            macos-src-v2-${{ inputs.component }}-
            macos-src-v2-
      - name: Install native build tools
        if: ${{ inputs.component == 'all' || inputs.component == 'media-runtime' }}
        run: |
          brew install cmake ninja nasm pkg-config
          python3 -m venv "$RUNNER_TEMP/media-build-tools"
          "$RUNNER_TEMP/media-build-tools/bin/pip" install "meson==1.3.2"
          echo "$RUNNER_TEMP/media-build-tools/bin" >> "$GITHUB_PATH"
      - name: Build shared media runtime when selected
        if: ${{ inputs.component == 'all' || inputs.component == 'media-runtime' }}
        run: native_deps/media_runtime/build-macos.sh
      - name: Build ImageMagick when selected
        if: ${{ inputs.component == 'all' || inputs.component == 'imagemagick' }}
        run: native_deps/imagemagick/build-macos.sh
      - name: Build resvg when selected
        if: ${{ inputs.component == 'all' || inputs.component == 'resvg' }}
        run: native_deps/resvg/build-macos.sh
      - name: Create corresponding-source archives
        run: |
          if [ "$COMPONENT" = all ] || [ "$COMPONENT" = imagemagick ]; then
            version="$(ruby -rjson -e 'puts JSON.parse(File.read("native_deps/manifests/macos.json")).dig("components", "imagemagick", "version")')"
            revision="$(ruby -rjson -e 'puts JSON.parse(File.read("native_deps/manifests/macos.json")).dig("components", "imagemagick", "releaseRevision")')"
            RELEASE_ID="imagemagick-macos-${version}-xfilesuite.${revision}" native_deps/imagemagick/package-source.sh
          fi
          if [ "$COMPONENT" = all ] || [ "$COMPONENT" = resvg ]; then
            version="$(ruby -rjson -e 'puts JSON.parse(File.read("native_deps/manifests/macos.json")).dig("components", "resvg", "version")')"
            revision="$(ruby -rjson -e 'puts JSON.parse(File.read("native_deps/manifests/macos.json")).dig("components", "resvg", "releaseRevision")')"
            RELEASE_ID="resvg-macos-${version}-xfilesuite.${revision}" native_deps/resvg/package-source.sh
          fi
          if [ "$COMPONENT" = all ] || [ "$COMPONENT" = media-runtime ]; then
            native_deps/media_runtime/package-source.sh
          fi
      - name: Record previous R2 dependency keys
        run: |
          ruby -rjson -e '
            components = JSON.parse(File.read("native_deps/manifests/macos.json")).fetch("components")
            File.open(ENV.fetch("GITHUB_ENV"), "a") do |f|
              f.puts("PREVIOUS_FFMPEG_R2_KEY=#{components.dig("ffmpeg", "r2Key")}")
              f.puts("PREVIOUS_IMAGEMAGICK_R2_KEY=#{components.fetch("imagemagick").fetch("r2Key")}")
              f.puts("PREVIOUS_RESVG_R2_KEY=#{components.fetch("resvg").fetch("r2Key")}")
              f.puts("PREVIOUS_MEDIA_RUNTIME_R2_KEY=#{components.dig("mediaRuntime", "r2Key")}")
            end
          '
      - name: Update manifest with final binary hashes
        run: |
          # The quoted program is Ruby; backticks execute inside Ruby.
          # shellcheck disable=SC2016
          ruby -rjson -e '
            path = "native_deps/manifests/macos.json"
            data = JSON.parse(File.read(path))
            component = ENV.fetch("COMPONENT")
            if ["all", "imagemagick"].include?(component)
              item = data["components"]["imagemagick"]
              item["architecture"] = "universal"
              sha = `shasum -a 256 native_deps/imagemagick/dist/imagemagick-macos-universal`.split.first
              item["binarySha256"] = sha
              item["r2Key"] = "deps/imagemagick-macos-universal-#{sha}"
              item["sourceRelease"] = "imagemagick-macos-#{item["version"]}-xfilesuite.#{item.fetch("releaseRevision")}"
            end
            if ["all", "resvg"].include?(component)
              item = data["components"]["resvg"]
              sha = `shasum -a 256 native_deps/resvg/dist/resvg-macos-universal`.split.first
              item["binarySha256"] = sha
              item["r2Key"] = "deps/resvg-macos-universal-#{sha}"
              item["sourceRelease"] = "resvg-macos-#{item["version"]}-xfilesuite.#{item.fetch("releaseRevision")}"
            end
            if ["all", "media-runtime"].include?(component)
              data["components"].delete("ffmpeg")
              item = data["components"]["mediaRuntime"] ||= {
                "version" => "8.1.2-mpv-0.41.0",
                "releaseRevision" => 1,
                "architecture" => "universal"
              }
              archive = Dir["native_deps/media_runtime/dist/media-runtime-*.tar.gz"].first
              sha = `shasum -a 256 #{archive}`.split.first
              item["bundleSha256"] = sha
              item["r2Key"] = "deps/media-runtime-macos-#{item["version"]}-#{sha}"
              item["sourceRelease"] = "media-runtime-macos-#{item["version"]}-xfilesuite.#{item.fetch("releaseRevision")}"
            end
            File.write(path, JSON.pretty_generate(data) + "\n")
          '
      - name: Publish corresponding source on GitHub
        run: |
          release_repo="XFileSuite/XFileSuite"
          publish() {
            release="$1"; archive="$2"
            GH_TOKEN="$SOURCE_WRITE_TOKEN" gh release view "$release" --repo "$release_repo" >/dev/null 2>&1 || \
              GH_TOKEN="$SOURCE_WRITE_TOKEN" gh release create "$release" --repo "$release_repo" --title "$release" --notes "Corresponding source, notices, build information, and checksums for XFileSuite macOS native dependencies."
            GH_TOKEN="$SOURCE_WRITE_TOKEN" gh release upload "$release" "$archive" "$archive.sha256" --repo "$release_repo" --clobber
          }
          if [ "$COMPONENT" = all ] || [ "$COMPONENT" = imagemagick ]; then
            archive="$(find native_deps/imagemagick/dist -name 'xfilesuite-*-source.tar.gz' -maxdepth 1 -print -quit)"
            publish "$(ruby -rjson -e 'puts JSON.parse(File.read("native_deps/manifests/macos.json")).dig("components", "imagemagick", "sourceRelease")')" "$archive"
          fi
          if [ "$COMPONENT" = all ] || [ "$COMPONENT" = resvg ]; then
            archive="$(find native_deps/resvg/dist -maxdepth 1 -name 'xfilesuite-*-source.tar.gz' -print -quit)"
            publish "$(ruby -rjson -e 'puts JSON.parse(File.read("native_deps/manifests/macos.json")).dig("components", "resvg", "sourceRelease")')" "$archive"
          fi
          if [ "$COMPONENT" = all ] || [ "$COMPONENT" = media-runtime ]; then
            archive="$(find native_deps/media_runtime/dist -name 'xfilesuite-*-source.tar.gz' -maxdepth 1 -print -quit)"
            publish "$(ruby -rjson -e 'puts JSON.parse(File.read("native_deps/manifests/macos.json")).dig("components", "mediaRuntime", "sourceRelease")')" "$archive"
          fi
      - name: Purge all native dependency objects before a full rebuild
        if: ${{ inputs.purge_all_deps }}
        run: |
          if [ "$COMPONENT" != all ] || [ "${{ inputs.platform }}" != all ]; then
            echo "::error::purge_all_deps requires component=all and platform=all"
            exit 1
          fi
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const baseUrl = `https://api.cloudflare.com/client/v4/accounts/${accountId}/r2/buckets/xfilesuite-releases/objects`;

          async function request(path, options = {}) {
            const response = await fetch(`${baseUrl}${path}`, {
              ...options,
              headers: { Authorization: `Bearer ${token}`, ...options.headers },
            });
            const body = await response.json();
            if (!response.ok || !body.success) {
              throw new Error(JSON.stringify(body.errors || body));
            }
            return body;
          }

          async function main() {
            for (const prefix of ['deps/ffmpeg-', 'deps/imagemagick-', 'deps/resvg-', 'deps/media-runtime-', 'deps/sbom-']) {
              let cursor;
              do {
                const query = new URLSearchParams({ prefix, per_page: '1000' });
                if (cursor) query.set('cursor', cursor);
                const page = await request(`?${query}`);
                for (const object of page.result || []) {
                  const key = object.key;
                  const encodedKey = key.split('/').map(encodeURIComponent).join('/');
                  await request(`/${encodedKey}`, { method: 'DELETE' });
                  console.log(`Deleted ${key}`);
                }
                cursor = page.result_info?.cursor || page.result_info?.cursors?.after;
              } while (cursor);
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Upload only selected runtime binaries to R2
        run: |
          if [ "$COMPONENT" = all ] || [ "$COMPONENT" = imagemagick ]; then
            npx wrangler r2 object put "xfilesuite-releases/$(ruby -rjson -e 'puts JSON.parse(File.read("native_deps/manifests/macos.json")).dig("components", "imagemagick", "r2Key")')" --file native_deps/imagemagick/dist/imagemagick-macos-universal --remote
          fi
          if [ "$COMPONENT" = all ] || [ "$COMPONENT" = resvg ]; then
            npx wrangler r2 object put "xfilesuite-releases/$(ruby -rjson -e 'puts JSON.parse(File.read("native_deps/manifests/macos.json")).dig("components", "resvg", "r2Key")')" --file native_deps/resvg/dist/resvg-macos-universal --remote
          fi
          if [ "$COMPONENT" = all ] || [ "$COMPONENT" = media-runtime ]; then
            npx wrangler r2 object put "xfilesuite-releases/$(ruby -rjson -e 'puts JSON.parse(File.read("native_deps/manifests/macos.json")).dig("components", "mediaRuntime", "r2Key")')" --file "$(find native_deps/media_runtime/dist -name 'media-runtime-*.tar.gz' -maxdepth 1 -print -quit)" --remote
          fi
      - name: Generate and upload macOS SBOM
        run: |
          ruby native_deps/generate-sbom.rb native_deps/manifests/macos.json native_deps/sbom-macos.json
          npx wrangler r2 object put "xfilesuite-releases/deps/sbom-macos.json" --file native_deps/sbom-macos.json --remote
      - name: Commit the canonical public manifest
        run: |
          git config user.name "xfilesuite-release-bot"
          git config user.email "release-bot@xfilesuite.com"
          git add native_deps/manifests/macos.json native_deps/sbom-macos.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish macOS native dependency manifest and SBOM"
            # macOS and Windows publish jobs update different manifest files
            # concurrently. Rebase our manifest-only commit if the sibling
            # job reached main first, then retry the push.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "Unable to publish the macOS manifest after retries" >&2
                exit 1
              fi
              git fetch origin main
              git rebase origin/main
            done
          fi
      - name: Mirror manifest to the private App source repository
        run: |
          git clone "https://x-access-token:${SOURCE_WRITE_TOKEN}@github.com/XFileSuite/XFileSuiteSource.git" "$RUNNER_TEMP/XFileSuiteSource" --depth 1
          cp native_deps/manifests/macos.json "$RUNNER_TEMP/XFileSuiteSource/native_deps/manifests/macos.json"
          mkdir -p "$RUNNER_TEMP/XFileSuiteSource/native_deps/sbom"
          cp native_deps/sbom-macos.json "$RUNNER_TEMP/XFileSuiteSource/native_deps/sbom/sbom-macos.json"
          git -C "$RUNNER_TEMP/XFileSuiteSource" config user.name "xfilesuite-release-bot"
          git -C "$RUNNER_TEMP/XFileSuiteSource" config user.email "release-bot@xfilesuite.com"
          git -C "$RUNNER_TEMP/XFileSuiteSource" add native_deps/manifests/macos.json native_deps/sbom/sbom-macos.json
          if ! git -C "$RUNNER_TEMP/XFileSuiteSource" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/XFileSuiteSource" commit -m "chore: publish macOS native dependency manifest and SBOM"
            git -C "$RUNNER_TEMP/XFileSuiteSource" push origin HEAD:main
          fi
      - name: Publish current manifest to the public repository
        run: |
          gh repo clone XFileSuite/XFileSuite "$RUNNER_TEMP/XFileSuite" -- --depth 1
          git -C "$RUNNER_TEMP/XFileSuite" remote set-url origin "https://x-access-token:${SOURCE_WRITE_TOKEN}@github.com/XFileSuite/XFileSuite.git"
          mkdir -p "$RUNNER_TEMP/XFileSuite/native-deps"
          cp native_deps/manifests/macos.json "$RUNNER_TEMP/XFileSuite/native-deps/macos.json"
          cp native_deps/sbom-macos.json "$RUNNER_TEMP/XFileSuite/native-deps/sbom-macos.json"
          git -C "$RUNNER_TEMP/XFileSuite" config user.name "xfilesuite-release-bot"
          git -C "$RUNNER_TEMP/XFileSuite" config user.email "release-bot@xfilesuite.com"
          git -C "$RUNNER_TEMP/XFileSuite" add native-deps/macos.json native-deps/sbom-macos.json
          if ! git -C "$RUNNER_TEMP/XFileSuite" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/XFileSuite" commit -m "chore: publish macOS native dependency manifest and SBOM"
            git -C "$RUNNER_TEMP/XFileSuite" push origin HEAD:main
          fi
      - name: Remove superseded R2 dependency objects
        run: |
          current_key() {
            ruby -rjson -e 'puts JSON.parse(File.read("native_deps/manifests/macos.json")).dig("components", ARGV.fetch(0), "r2Key")' "$1"
          }
          remove_previous() {
            previous="$1"; current="$2"
            if [ -n "$previous" ] && [ "$previous" != "$current" ]; then
              npx wrangler r2 object delete "xfilesuite-releases/$previous" --remote || true
            fi
          }
          if [ "$COMPONENT" = all ] || [ "$COMPONENT" = imagemagick ]; then
            remove_previous "$PREVIOUS_IMAGEMAGICK_R2_KEY" "$(current_key imagemagick)"
            npx wrangler r2 object delete "xfilesuite-releases/deps/imagemagick-macos-universal" --remote || true
          fi
          if [ "$COMPONENT" = all ] || [ "$COMPONENT" = resvg ]; then
            remove_previous "$PREVIOUS_RESVG_R2_KEY" "$(current_key resvg)"
            npx wrangler r2 object delete "xfilesuite-releases/deps/resvg-macos-universal" --remote || true
          fi
          if [ "$COMPONENT" = all ] || [ "$COMPONENT" = media-runtime ]; then
            remove_previous "$PREVIOUS_MEDIA_RUNTIME_R2_KEY" "$(current_key mediaRuntime)"
            if [ -n "$PREVIOUS_FFMPEG_R2_KEY" ]; then
              npx wrangler r2 object delete "xfilesuite-releases/$PREVIOUS_FFMPEG_R2_KEY" --remote || true
            fi
            npx wrangler r2 object delete "xfilesuite-releases/deps/ffmpeg-macos-universal" --remote || true
          fi

  publish-windows:
    # Windows artifacts are continuously prepared, but this workflow never
    # creates a Windows App installer or a public Windows App release.
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'windows') }}
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_WRITE_TOKEN: ${{ secrets.XFILESUITE_SOURCE_WRITE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COMPONENT: ${{ inputs.component }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Require the canonical source branch
        shell: pwsh
        run: if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Run from main only.' }
      - name: Validate release credentials
        shell: pwsh
        run: |
          if (-not $env:SOURCE_WRITE_TOKEN -or -not $env:CLOUDFLARE_API_TOKEN -or -not $env:CLOUDFLARE_ACCOUNT_ID) {
            throw 'Release and Cloudflare credentials are required.'
          }
      - name: Resolve Windows dependency versions from the manifest
        shell: pwsh
        run: |
          $manifest = Get-Content native_deps/manifests/windows.json -Raw | ConvertFrom-Json
          $ffmpegVersion = $manifest.components.mediaRuntime.version -replace '-mpv-.*$', ''
          "FFMPEG_VERSION=$ffmpegVersion" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "IMAGEMAGICK_VERSION=$($manifest.components.imagemagick.version)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Restore source tarballs cache
        uses: actions/cache@v4
        with:
          path: |
            native_deps/ffmpeg/work-windows
            native_deps/media_runtime/work/*.tar.gz
            native_deps/media_runtime/work/*.7z
            native_deps/media_runtime/work/ffmpeg/*.tar.xz
            native_deps/imagemagick/work-windows
          key: windows-src-v2-${{ inputs.component }}-${{ hashFiles('native_deps/ffmpeg/build-windows.sh', 'native_deps/media_runtime/build-windows.sh', 'native_deps/imagemagick/build-windows.ps1') }}
          restore-keys: |
            windows-src-v2-${{ inputs.component }}-
            windows-src-v2-
      - name: Restore Windows compiler cache
        id: windows-compiler-cache
        if: ${{ inputs.component == 'all' || inputs.component == 'media-runtime' }}
        uses: actions/cache@v4
        with:
          path: .cache/ccache/windows
          key: windows-ccache-v1-${{ hashFiles('native_deps/ffmpeg/build-windows.sh', 'native_deps/media_runtime/build-windows.sh') }}
          restore-keys: |
            windows-ccache-v1-
      - name: Set up MSYS2 toolchain for LGPL FFmpeg and libmpv
        if: ${{ inputs.component == 'all' || inputs.component == 'media-runtime' }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make git patch mingw-w64-x86_64-binutils mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-pkgconf mingw-w64-x86_64-meson mingw-w64-x86_64-ninja
            mingw-w64-x86_64-lame mingw-w64-x86_64-libogg mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libvpx mingw-w64-x86_64-libwebp mingw-w64-x86_64-opus
            mingw-w64-x86_64-dav1d mingw-w64-x86_64-libass mingw-w64-x86_64-freetype mingw-w64-x86_64-fontconfig
            mingw-w64-x86_64-fribidi mingw-w64-x86_64-harfbuzz mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-uchardet mingw-w64-x86_64-lcms2 mingw-w64-x86_64-expat
            mingw-w64-x86_64-iconv p7zip
      - name: Build shared media runtime for Windows x64
        if: ${{ inputs.component == 'all' || inputs.component == 'media-runtime' }}
        shell: msys2 {0}
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache/windows
        run: |
          set -o pipefail
          native_deps/media_runtime/build-windows.sh 2>&1 | tee media-runtime-windows-build.log
          exit "${PIPESTATUS[0]}"
      - name: Upload media runtime build log
        if: ${{ always() && (inputs.component == 'all' || inputs.component == 'media-runtime') }}
        uses: actions/upload-artifact@v4
        with:
          name: media-runtime-windows-build-log-${{ github.run_attempt }}
          path: media-runtime-windows-build.log
          if-no-files-found: warn
      - name: Save Windows source cache after diagnostics
        if: ${{ always() && steps.windows-source-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            native_deps/ffmpeg/work-windows
            native_deps/media_runtime/work/*.tar.gz
            native_deps/media_runtime/work/*.7z
            native_deps/media_runtime/work/ffmpeg/*.tar.xz
            native_deps/imagemagick/work-windows
          key: windows-src-v2-${{ inputs.component }}-${{ hashFiles('native_deps/ffmpeg/build-windows.sh', 'native_deps/media_runtime/build-windows.sh', 'native_deps/imagemagick/build-windows.ps1') }}
      - name: Save Windows compiler cache after diagnostics
        if: ${{ always() && (inputs.component == 'all' || inputs.component == 'media-runtime') && steps.windows-compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/ccache/windows
          key: windows-ccache-v1-${{ hashFiles('native_deps/ffmpeg/build-windows.sh', 'native_deps/media_runtime/build-windows.sh') }}
      - name: Prepare the complete ImageMagick Windows runtime
        if: ${{ inputs.component == 'all' || inputs.component == 'imagemagick' }}
        shell: pwsh
        run: native_deps/imagemagick/build-windows.ps1
      - name: Create Windows corresponding-source archives
        shell: pwsh
        run: |
          $manifest = Get-Content native_deps/manifests/windows.json -Raw | ConvertFrom-Json
          if ($env:COMPONENT -in @('all', 'imagemagick')) {
            $env:PLATFORM = 'windows'
            $env:RELEASE_ID = "imagemagick-windows-$($manifest.components.imagemagick.version)-xfilesuite.$($manifest.components.imagemagick.releaseRevision)"
            $env:OUT_DIR = 'native_deps/imagemagick/dist-windows'
            bash native_deps/imagemagick/package-source.sh
          }
          if ($env:COMPONENT -in @('all', 'media-runtime')) {
            bash native_deps/media_runtime/package-windows-source.sh
          }
      - name: Record previous Windows R2 dependency keys
        shell: pwsh
        run: |
          $manifest = Get-Content native_deps/manifests/windows.json -Raw | ConvertFrom-Json
          "PREVIOUS_WIN_IMAGEMAGICK_R2_KEY=$($manifest.components.imagemagick.r2Key)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if ($manifest.components.mediaRuntime) {
            "PREVIOUS_WIN_MEDIA_RUNTIME_R2_KEY=$($manifest.components.mediaRuntime.r2Key)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
      - name: Update the Windows manifest with final hashes
        shell: pwsh
        run: |
          $path = 'native_deps/manifests/windows.json'
          $data = Get-Content $path -Raw | ConvertFrom-Json
          if ($env:COMPONENT -in @('all', 'imagemagick')) {
            $item = $data.components.imagemagick
            $sha = (Get-FileHash -Algorithm SHA256 "native_deps/imagemagick/dist-windows/imagemagick-$($item.version)-windows-x64.zip").Hash.ToLowerInvariant()
            $item.bundleSha256 = $sha; $item.r2Key = "deps/imagemagick-windows-x64-$sha.zip"
            $item.sourceRelease = "imagemagick-windows-$($item.version)-xfilesuite.$($item.releaseRevision)"
          }
          if ($env:COMPONENT -in @('all', 'media-runtime')) {
            $item = $data.components.mediaRuntime
            $archive = Get-ChildItem "native_deps/media_runtime/dist/media-runtime-windows-*.tar.gz" | Select-Object -First 1
            $sha = (Get-FileHash -Algorithm SHA256 $archive.FullName).Hash.ToLowerInvariant()
            $item.bundleSha256 = $sha; $item.r2Key = "deps/media-runtime-windows-$($item.version)-$sha"
            $item.sourceRelease = "media-runtime-windows-$($item.version)-xfilesuite.$($item.releaseRevision)"
          }
          $data | ConvertTo-Json -Depth 8 | Set-Content $path
      - name: Publish Windows source, notices and build records on GitHub
        shell: pwsh
        run: |
          $releaseRepo = 'XFileSuite/XFileSuite'
          function Publish-Source($release, $archive) {
          $originalGhToken = $env:GH_TOKEN
          $env:GH_TOKEN = $env:SOURCE_WRITE_TOKEN
          try {
            gh release view $release --repo $releaseRepo 2>$null
            if ($LASTEXITCODE -ne 0) { gh release create $release --repo $releaseRepo --title $release --notes 'Corresponding source, notices, build information, and checksums for XFileSuite Windows native dependencies.' }
            gh release upload $release $archive "$archive.sha256" --repo $releaseRepo --clobber
          } finally {
            $env:GH_TOKEN = $originalGhToken
          }
          }
          $manifest = Get-Content native_deps/manifests/windows.json -Raw | ConvertFrom-Json
          if ($env:COMPONENT -in @('all', 'imagemagick')) { Publish-Source $manifest.components.imagemagick.sourceRelease (Get-ChildItem native_deps/imagemagick/dist-windows/xfilesuite-*-source.tar.gz | Select-Object -First 1).FullName }
          if ($env:COMPONENT -in @('all', 'media-runtime')) { Publish-Source $manifest.components.mediaRuntime.sourceRelease (Get-ChildItem native_deps/media_runtime/dist/xfilesuite-media-runtime-windows-*-source.tar.gz | Select-Object -First 1).FullName }
      - name: Upload Windows runtime dependencies to R2
        shell: pwsh
        run: |
          $manifest = Get-Content native_deps/manifests/windows.json -Raw | ConvertFrom-Json
          if ($env:COMPONENT -in @('all', 'imagemagick')) { npx wrangler r2 object put "xfilesuite-releases/$($manifest.components.imagemagick.r2Key)" --file "native_deps/imagemagick/dist-windows/imagemagick-$($manifest.components.imagemagick.version)-windows-x64.zip" --remote }
          if ($env:COMPONENT -in @('all', 'media-runtime')) {
            $archive = Get-ChildItem "native_deps/media_runtime/dist/media-runtime-windows-*.tar.gz" | Select-Object -First 1
            npx wrangler r2 object put "xfilesuite-releases/$($manifest.components.mediaRuntime.r2Key)" --file $archive.FullName --remote
          }
      - name: Generate and upload Windows SBOM
        shell: pwsh
        run: |
          ruby native_deps/generate-sbom.rb native_deps/manifests/windows.json native_deps/sbom-windows.json
          npx wrangler r2 object put "xfilesuite-releases/deps/sbom-windows.json" --file native_deps/sbom-windows.json --remote
      - name: Commit and mirror the Windows manifest
        shell: pwsh
        run: |
          git config user.name 'xfilesuite-release-bot'; git config user.email 'release-bot@xfilesuite.com'
          git add native_deps/manifests/windows.json native_deps/sbom-windows.json
          git diff --cached --quiet; if ($LASTEXITCODE -ne 0) {
            git commit -m 'chore: publish Windows native dependency manifest and SBOM'
            $pushed = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              git push origin HEAD:main
              if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
              if ($attempt -eq 3) { throw 'Unable to publish the Windows manifest after retries' }
              git fetch origin main
              if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch main before retrying the Windows manifest push' }
              git rebase origin/main
              if ($LASTEXITCODE -ne 0) { throw 'Unable to rebase the Windows manifest commit onto main' }
            }
            if (-not $pushed) { throw 'Unable to publish the Windows manifest' }
          }
          git clone "https://x-access-token:$env:SOURCE_WRITE_TOKEN@github.com/XFileSuite/XFileSuiteSource.git" "$env:RUNNER_TEMP/XFileSuiteSource" --depth 1
          Copy-Item native_deps/manifests/windows.json "$env:RUNNER_TEMP/XFileSuiteSource/native_deps/manifests/windows.json"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/XFileSuiteSource/native_deps/sbom" | Out-Null
          Copy-Item native_deps/sbom-windows.json "$env:RUNNER_TEMP/XFileSuiteSource/native_deps/sbom/sbom-windows.json"
          git -C "$env:RUNNER_TEMP/XFileSuiteSource" config user.name 'xfilesuite-release-bot'; git -C "$env:RUNNER_TEMP/XFileSuiteSource" config user.email 'release-bot@xfilesuite.com'
          git -C "$env:RUNNER_TEMP/XFileSuiteSource" add native_deps/manifests/windows.json native_deps/sbom/sbom-windows.json
          git -C "$env:RUNNER_TEMP/XFileSuiteSource" diff --cached --quiet; if ($LASTEXITCODE -ne 0) { git -C "$env:RUNNER_TEMP/XFileSuiteSource" commit -m 'chore: publish Windows native dependency manifest and SBOM'; git -C "$env:RUNNER_TEMP/XFileSuiteSource" push origin HEAD:main }
          gh repo clone XFileSuite/XFileSuite "$env:RUNNER_TEMP/XFileSuite" -- --depth 1
          git -C "$env:RUNNER_TEMP/XFileSuite" remote set-url origin "https://x-access-token:$env:SOURCE_WRITE_TOKEN@github.com/XFileSuite/XFileSuite.git"
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/XFileSuite/native-deps" | Out-Null
          Copy-Item native_deps/manifests/windows.json "$env:RUNNER_TEMP/XFileSuite/native-deps/windows.json"
          Copy-Item native_deps/sbom-windows.json "$env:RUNNER_TEMP/XFileSuite/native-deps/sbom-windows.json"
          git -C "$env:RUNNER_TEMP/XFileSuite" config user.name 'xfilesuite-release-bot'; git -C "$env:RUNNER_TEMP/XFileSuite" config user.email 'release-bot@xfilesuite.com'
          git -C "$env:RUNNER_TEMP/XFileSuite" add native-deps/windows.json native-deps/sbom-windows.json
          git -C "$env:RUNNER_TEMP/XFileSuite" diff --cached --quiet; if ($LASTEXITCODE -ne 0) { git -C "$env:RUNNER_TEMP/XFileSuite" commit -m 'chore: publish Windows native dependency manifest and SBOM'; git -C "$env:RUNNER_TEMP/XFileSuite" push origin HEAD:main }
      - name: Remove superseded Windows R2 dependency objects
        shell: pwsh
        run: |
          $manifest = Get-Content native_deps/manifests/windows.json -Raw | ConvertFrom-Json
          function Remove-Previous($previous, $current) {
            if ($previous -and $previous -ne $current) {
              npx wrangler r2 object delete "xfilesuite-releases/$previous" --remote 2>$null; if ($LASTEXITCODE -ne 0) { Write-Host "  (object not found or already deleted: $previous)" }
            }
          }
          if ($env:COMPONENT -in @('all', 'imagemagick')) {
            Remove-Previous $env:PREVIOUS_WIN_IMAGEMAGICK_R2_KEY $manifest.components.imagemagick.r2Key
          }
          if ($env:COMPONENT -in @('all', 'media-runtime') -and $env:PREVIOUS_WIN_MEDIA_RUNTIME_R2_KEY) {
            Remove-Previous $env:PREVIOUS_WIN_MEDIA_RUNTIME_R2_KEY $manifest.components.mediaRuntime.r2Key
          }
