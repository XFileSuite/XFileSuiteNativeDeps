name: Publish Optional Fonts

on:
  pull_request:
    paths:
      - .github/workflows/publish-fonts.yml
      - fonts/**
  push:
    paths:
      - .github/workflows/publish-fonts.yml
      - fonts/**
  workflow_dispatch:
    inputs:
      mode:
        description: Validate locally tracked packages or publish the complete font set
        type: choice
        options: [validate, publish]
        default: validate

concurrency:
  group: optional-fonts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify package manifest and font binaries
        run: node fonts/publish.mjs

  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
      - name: Require canonical branch and Cloudflare credentials
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Verify and publish complete font set
        run: node fonts/publish.mjs --upload
