name: Test macOS Media Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - codex/media-runtime-shared
    paths:
      - .github/workflows/test-media-runtime.yml
      - native_deps/ffmpeg/**
      - native_deps/media_runtime/**

concurrency:
  group: test-media-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up current Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install native build tools
        run: brew install cmake meson ninja nasm pkg-config

      - name: Restore source and intermediate cache
        uses: actions/cache@v4
        with:
          path: native_deps/media_runtime/work
          key: media-runtime-macos-v1-${{ hashFiles('native_deps/ffmpeg/build.sh', 'native_deps/media_runtime/**') }}
          restore-keys: |
            media-runtime-macos-v1-

      - name: Build shared FFmpeg, shared libmpv, and thin FFmpeg CLI
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          set -o pipefail
          native_deps/media_runtime/build-macos.sh 2>&1 | tee media-runtime-build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-runtime-build-log-${{ github.run_attempt }}
          path: media-runtime-build.log
          if-no-files-found: warn

      - name: Upload runtime test artifact
        uses: actions/upload-artifact@v4
        with:
          name: xfilesuite-media-runtime-macos
          path: native_deps/media_runtime/dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
