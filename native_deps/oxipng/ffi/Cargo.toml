[package]
name = "oxipng-c"
version = "10.2.0"
edition = "2021"
publish = false
description = "C ABI facade over oxipng for XFileSuite FFI"
license = "MIT"

[lib]
name = "oxipng"
crate-type = ["cdylib", "staticlib"]
path = "src/lib.rs"

[dependencies]
oxipng = { version = "=10.2.0", default-features = false, features = ["parallel", "zopfli"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
